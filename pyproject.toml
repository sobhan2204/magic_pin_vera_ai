[project]
name = "vera-bot"
version = "1.0.0"
description = "magicpin AI Challenge: Vera merchant assistant bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "upstash-redis>=1.1,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["live: real LLM calls (opt-in: pytest -m live)"]
addopts = "-m 'not live'"
